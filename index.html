<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СУП 2.0</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Аварийный индикатор ошибок
        window.onerror = function (msg, src, line) {
            window.__err = (window.__err || '') + msg + ' (строка ' + line + ')\n';
        };
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (window.__err || typeof startApp !== 'function') {
                    var d = document.createElement('div');
                    d.style.cssText = 'background:#fff;color:#d00;padding:10px;font-size:12px;position:fixed;top:0;left:0;right:0;z-index:9999;white-space:pre-wrap;text-align:left;';
                    d.textContent = '⚠️ Ошибка JS: ' + (window.__err || 'script.js не загрузился или не выполнился');
                    document.body.appendChild(d);
                }
            }, 1500);
        });
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app">
        <!-- Приветствие -->
        <div id="welcome-screen" class="screen active">
            <div class="hearts-bg"><span>💕</span><span>💘</span><span>💖</span><span>💗</span><span>💓</span></div>
            <div class="welcome-content">
                <h1 class="logo">СУП</h1>
                <p class="tagline">Спросил · Увидел · Полюбил</p>
                <p class="subtitle">Легендарная игра вернулась в Telegram!</p>
                <button class="btn-primary" onclick="startApp()">Начать 💕</button>
            </div>
        </div>

        <!-- Регистрация -->
        <div id="registration-screen" class="screen">
            <div class="form-container">
                <h2>Давай познакомимся!</h2>
                <div class="avatar-upload" onclick="uploadPhoto()">
                    <div class="avatar-circle" id="avatar-preview">📷</div>
                    <div class="upload-hint">Загрузить фото</div>
                </div>
                <input type="file" id="photo-input" accept="image/*" style="display:none">
                <input type="text" id="user-name" class="input" placeholder="Как тебя зовут?">
                <input type="number" id="user-age" class="input" placeholder="Возраст" min="16" max="99">
                <input type="text" id="user-city" class="input" placeholder="Город">
                <input type="text" id="user-username" class="input" placeholder="@username (для совпадений)">
                <div class="gender-select">
                    <button class="gender-btn" data-gender="male" onclick="selectGender('male')">👨 Парень</button>
                    <button class="gender-btn" data-gender="female" onclick="selectGender('female')">👩 Девушка</button>
                </div>
                <button class="btn-primary" onclick="submitRegistration()">Создать профиль 🚀</button>
            </div>
        </div>

        <!-- Профиль -->
        <div id="profile-screen" class="screen">
            <div class="form-container">
                <h2>Твой профиль 💖</h2>
                <div class="profile-card">
                    <div class="avatar-circle big" id="profile-photo">📷</div>
                    <div id="profile-info" class="profile-info"></div>
                </div>
                <button class="btn-primary" onclick="openQuestion()">Играть 💘</button>
                <button class="btn-secondary" onclick="openPlayers()">Игроки в игре 👥</button>
                <button class="btn-secondary" onclick="editProfile()">Изменить ✏️</button>
            </div>
        </div>

        <!-- Игроки -->
        <div id="players-screen" class="screen">
            <div class="form-container">
                <h2>Игроки в игре 💕</h2>
                <div id="players-list" class="players-list"></div>
                <button class="btn-secondary" onclick="showProfile()">← Назад</button>
            </div>
        </div>

        <!-- Вопрос -->
        <div id="question-screen" class="screen">
